spring.application.name=pms-loyalty
server.port=${SERVER_PORT:8089}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/PMSystem_db?CurrentSchema=pms_loyalty}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_schema=pms_loyalty
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.create-schemas=true
spring.flyway.schemas=pms_loyalty
spring.flyway.default-schema=pms_loyalty

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

security.jwt.secret=${PMS_FRONTDESK_JWT_SECRET:pms-auth-super-secret-key-change-me-in-prod-2026}
security.jwt.public-paths=/error,/swagger-ui,/swagger-ui.html,/v3/api-docs,/actuator,/api/v1/loyalty/internal/memberships/ensure

loyalty.number.prefix=${LOYALTY_NUMBER_PREFIX:LOY}
