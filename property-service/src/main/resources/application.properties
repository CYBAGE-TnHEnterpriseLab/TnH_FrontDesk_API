spring.application.name=property-service
server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:5432/Property_Management_System_db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres


spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=pms_property_wizard

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=false
spring.flyway.create-schemas=true
spring.flyway.schemas=pms_property_wizard
spring.flyway.default-schema=pms_property_wizard

#spring.flyway.baseline-on-migrate=true


app.upload.base-dir=E:\\UpdateMain\\TnH_FrontDesk_API\\uploads
app.upload.max-bytes=5242880
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
springdoc.api-docs.path=/v3/api-docs
security.jwt.secret=${PMS_FRONTDESK_JWT_SECRET:pms-auth-super-secret-key-change-me-in-prod-2026}
security.jwt.public-paths=/error,/swagger-ui,/v3/api-docs,/actuator,/uploads
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,http://172.27.57.*:*,https://172.27.57.*:*
inventory.sync.base-url=${INVENTORY_SYNC_BASE_URL:http://localhost:8085}
housekeeping.sync.base-url=${HOUSEKEEPING_SYNC_BASE_URL:http://localhost:8086}
inventory.sync.horizon-days=${INVENTORY_SYNC_HORIZON_DAYS:365}
inventory.sync.timeout-seconds=${INVENTORY_SYNC_TIMEOUT_SECONDS:1800}

