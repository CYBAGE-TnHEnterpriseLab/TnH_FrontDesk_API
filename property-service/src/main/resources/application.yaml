server:
  port: 8081

app:
  seed:
    enabled: true

spring:
  application:
    name: property-service
  datasource:
    url: jdbc:postgresql://localhost:5432/pms_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: property
        hbm2ddl.create_namespaces: true

  jackson:
    time-zone: UTC

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/