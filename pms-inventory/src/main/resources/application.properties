spring.application.name= pms-inventory
spring.datasource.url= ${DB_URL:jdbc:postgresql://localhost:5432/Property_Management_System_db?CurrentSchema=pms_inventory}
spring.datasource.username= ${DB_USERNAME:postgres}
spring.datasource.password= ${DB_PASSWORD:postgres}
spring.datasource.driver-class-name= org.postgresql.Driver
spring.jpa.hibernate.ddl-auto= validate
spring.jpa.show-sql= true
spring.jpa.properties.hibernate.format_sql= true
spring.jpa.properties.hibernate.jdbc.batch_size= 50

spring.jpa.properties.hibernate.default_schema=pms_inventory

spring.flyway.enabled= true
spring.flyway.baseline-on-migrate= true
spring.flyway.validate-on-migrate= true
spring.flyway.create-schemas=true
spring.flyway.schemas=pms_inventory
spring.flyway.default-schema=pms_inventory

server.port= ${SERVER_PORT:8085}
springdoc.api-docs.path= /v3/api-docs
springdoc.swagger-ui.path= /swagger-ui.html
security.jwt.secret= ${PMS_FRONTDESK_JWT_SECRET:pms-auth-super-secret-key-change-me-in-prod-2026}


