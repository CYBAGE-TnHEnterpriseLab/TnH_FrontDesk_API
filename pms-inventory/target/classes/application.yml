spring.application.name: pms-inventory
spring.datasource.url: ${DB_URL:jdbc:postgresql://localhost:5432/pms_inventory}
spring.datasource.username: ${DB_USERNAME:postgres}
spring.datasource.password: ${DB_PASSWORD:postgres}
spring.datasource.driver-class-name: org.postgresql.Driver
spring.jpa.hibernate.ddl-auto: validate
spring.jpa.show-sql: false
spring.jpa.properties.hibernate.format_sql: true
spring.jpa.properties.hibernate.jdbc.batch_size: 50
spring.flyway.enabled: true
spring.flyway.baseline-on-migrate: true
spring.flyway.validate-on-migrate: true
server.port: ${SERVER_PORT:8084}
springdoc.api-docs.path: /v3/api-docs
springdoc.swagger-ui.path: /swagger-ui.html
security.jwt.secret: ${PMS_FRONTDESK_JWT_SECRET:pms-auth-super-secret-key-change-me-in-prod-2026}


