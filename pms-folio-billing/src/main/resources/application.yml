server:
  port: 8080

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/Property_Management_System_db?CurrentSchema=folio_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: folio_db
    open-in-view: false
  jackson:
    time-zone: UTC

  flyway:
    enabled: true
    validate-on-migrate: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    create-schemas: true
    schemas: folio_db
    default-schema: folio_db

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

security:
  jwt:
    # Use the same signing secret used by auth service.
    secret: ${PMS_FRONTDESK_JWT_SECRET:pms-auth-super-secret-key-change-me-in-prod-2026}
    secret-base64-encoded: false
    public-paths:
      - /actuator/health
      - /swagger-ui/**
      - /swagger-ui.html
      - /api-docs/**
      - /v3/api-docs/**
      - /error

integration:
  reservation-service:
    enabled: true
    base-url: http://localhost:8090
    # Prefer X-Property-Id request header; this is fallback from env/config.
    property-id: ${RESERVATION_PROPERTY_ID:}
