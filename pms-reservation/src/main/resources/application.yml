server:
  port: 8090

spring:
  application:
    name: frontdesk-dashboard
  datasource:
    url: jdbc:postgresql://localhost:5432/Property_Management_System_db?CurrentSchema=frontdeskdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
       maximum-pool-size: 5
       minimum-idle: 1
       connection-timeout: 30000
       idle-timeout: 600000
       max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        default_schema: frontdeskdb
    open-in-view: false
    
  flyway:
    enabled: true
    validate-on-migrate: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    create-schemas: true
    schemas: frontdeskdb
    default-schema: frontdeskdb

  jackson:
    time-zone: UTC

reservation-service:
  base-url: http://localhost:${server.port}
  arrivals-path: /api/v1/reservations/arrivals
  departures-path: /api/v1/reservations/departures
  connect-timeout-ms: 3000
  read-timeout-ms: 6000

property-wizard-service:
  enabled: true
  failOpenOnValidationError: true
  failOpenOnWriteError: true
  base-url: http://localhost:8082
  room-outlet-types-path: /api/rooms/properties/{propertyId}/room-outlet-types
  tax-rules-path: /api/taxes/properties/{propertyId}/rules

inventory-service:
  base-url: http://localhost:8085
  availability-path: /api/v1/inventory/availability
  reservations-path: /api/v1/inventory/reservations
  connect-timeout-ms: 3000
  read-timeout-ms: 6000

rate-management:
  baseUrl: http://localhost:8087
  serviceAuthToken: ${PMS_RATE_MANAGEMENT_SERVICE_TOKEN:}
  listRatePlansPath: /api/rate-plans/get-all-rate-plans/property/{propertyId}
  availablePlansPath: /api/rate-plans/available/property/{propertyId}
  calculatedPricePath: /api/rate-plans/final-price/property/{propertyId}/{id}/calculated-price
  connectTimeoutMs: 3000
  readTimeoutMs: 6000
  retryMaxAttempts: 2
  retryBackoffMs: 100

housekeeping-service:
  base-url: http://localhost:8086

dashboard:
  timeout-ms: 2500
  housekeeping:
    base-url: http://localhost:8086
    primary-path: /api/v1/housekeeping/dashboard
    secondary-path: /api/v1/housekeeping/rooms
  inventory:
    base-url: http://localhost:8085
    primary-path: /api/v1/inventory/daily
  property:
    base-url: http://localhost:8082
    primary-path: /api/rooms/properties/{propertyId}/room-outlet-types

arrivals:
  search:
    sync-mode: always

departures:
  search:
    sync-mode: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origin-patterns: http://172.27.57.211:4200,http://172.27.57.175:4200,http://172.27.57.97:4200,http://localhost:4200,http://172.27.212.27:4200
    
security:
  jwt:
    enabled: true
    secret: ${PMS_FRONTDESK_JWT_SECRET:pms-auth-super-secret-key-change-me-in-prod-2026}
