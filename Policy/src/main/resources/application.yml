spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/PMSystem_db?currentSchema=policy_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000 
 
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: policy_db

  flyway:
    enabled: true
    validate-on-migrate: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    create-schemas: true
    schemas: policy_db
    default-schema: policy_db

# Log SQL parameters if needed
logging:
  level:
    org.hibernate.SQL: DEBUG

h2:
    console:
      enabled: true
      path: /h2-console
