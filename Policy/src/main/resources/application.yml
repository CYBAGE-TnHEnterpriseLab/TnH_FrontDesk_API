spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/policy_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Log SQL parameters if needed
logging:
  level:
    org.hibernate.SQL: DEBUG
