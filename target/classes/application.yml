server:
  port: 8090

spring:
  application:
    name: frontdesk-arrival
  datasource:
    url: jdbc:postgresql://localhost:5432/frontdeskdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    time-zone: UTC

reservation-service:
  base-url: http://localhost:8081
  arrivals-path: /api/v1/reservations/arrivals
  connect-timeout-ms: 3000
  read-timeout-ms: 6000

arrivals:
  search:
    sync-mode: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
