spring.application.name=pms-auth
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/pms_auth
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=false
spring.flyway.baseline-on-migrate=true

security.jwt.secret=${PMS_FRONTDESK_JWT_SECRET:pms-auth-super-secret-key-change-me-in-prod-2026}
security.jwt.access-token-expiration-seconds=600
security.jwt.refresh-token-expiration-seconds=1209600
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,http://172.27.57.*:*,https://172.27.57.*:*

