server:
  port: 8082

spring:
  application:
    name: room-service

  datasource:
    url: jdbc:postgresql://localhost:5432/pms_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: room
        hbm2ddl.create_namespaces: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

services:
  property-service:
    base-url: http://localhost:8081
                                                       