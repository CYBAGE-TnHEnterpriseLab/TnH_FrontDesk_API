server:
  port: 8090

spring:
  application:
    name: frontdesk-dashboard
  datasource:
    url: jdbc:postgresql://localhost:5432/frontdeskdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    time-zone: UTC

reservation-service:
  base-url: http://localhost:${server.port}
  arrivals-path: /api/v1/reservations/arrivals
  departures-path: /api/v1/reservations/departures
  connect-timeout-ms: 3000
  read-timeout-ms: 6000

property-wizard-service:
  enabled: true
  failOpenOnValidationError: true
  failOpenOnWriteError: true
  base-url: http://localhost:8082
  inventory-validation-path: /api/v1/property-wizard/inventory/validate
  inventory-availability-path: /api/rooms/properties/{propertyId}/inventory-rooms
  room-outlet-types-path: /api/rooms/properties/{propertyId}/room-outlet-types
  tax-rules-path: /api/taxes/properties/{propertyId}/rules
  inventory-deduction-path: /api/v1/property-wizard/inventory/deduct
  inventory-sync-path: /api/v1/property-wizard/inventory/sync

rate-management:
  baseUrl: http://localhost:8087
  serviceAuthToken: ${PMS_RATE_MANAGEMENT_SERVICE_TOKEN:}
  listRatePlansPath: /api/rate-plans/property/{propertyId}
  availablePlansPath: /api/rate-plans/property/{propertyId}/available
  calculatedPricePath: /api/rate-plans/property/{propertyId}/{ratePlanId}/calculated-price
  connectTimeoutMs: 3000
  readTimeoutMs: 6000
  retryMaxAttempts: 2
  retryBackoffMs: 100

dashboard:
  timeout-ms: 2500
  housekeeping:
    base-url: http://localhost:8086
    primary-path: /api/v1/housekeeping/dashboard
    secondary-path: /api/v1/housekeeping/rooms
  inventory:
    base-url: http://localhost:8085
    primary-path: /api/v1/inventory/daily
  property:
    base-url: http://localhost:8082
    primary-path: /api/rooms/properties/{propertyId}/room-outlet-types
  rate:
    base-url: http://localhost:8087
    primary-path: /api/rate-plans/property/{propertyId}
  reservation:
    base-url: http://localhost:${server.port}
    primary-path: /api/v1/guest-listing/list

arrivals:
  search:
    sync-mode: always

departures:
  search:
    sync-mode: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: http://172.27.57.211:4200,http://172.27.57.175:4200,http://172.27.57.97:4200,http://localhost:4200
    
security:
  jwt:
    enabled: true
    secret: ${PMS_FRONTDESK_JWT_SECRET:pms-auth-super-secret-key-change-me-in-prod-2026}
