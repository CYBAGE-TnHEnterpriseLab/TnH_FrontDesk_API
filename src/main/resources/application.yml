server:
  port: 8090

spring:
  application:
    name: frontdesk-arrival
  datasource:
    url: jdbc:postgresql://localhost:5432/frontdeskdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    time-zone: UTC

reservation-service:
  base-url: http://localhost:8081
  arrivals-path: /api/v1/reservations/arrivals
  departures-path: /api/v1/reservations/departures
  connect-timeout-ms: 3000
  read-timeout-ms: 6000

property-wizard-service:
  enabled: false
  base-url: http://localhost:8082
  inventory-validation-path: /api/v1/property-wizard/inventory/validate
  inventory-availability-path: /api/v1/property-wizard/inventory/availability
  inventory-deduction-path: /api/v1/property-wizard/inventory/deduct
  inventory-sync-path: /api/v1/property-wizard/inventory/sync

rate-management-service:
  base-url: http://localhost:8087
  availability-pricing-path: /api/v1/rate-management/pricing/quotes

arrivals:
  search:
    sync-mode: always

departures:
  search:
    sync-mode: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
