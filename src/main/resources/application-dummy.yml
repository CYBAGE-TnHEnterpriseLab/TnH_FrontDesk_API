spring:
  datasource:
    url: jdbc:h2:mem:frontdeskdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console

reservation-service:
  base-url: http://localhost:${server.port}
  arrivals-path: /internal/mock/reservations/arrivals
  departures-path: /internal/mock/reservations/departures
  connect-timeout-ms: 1000
  read-timeout-ms: 2000

property-wizard-service:
  enabled: false
  base-url: http://localhost:${server.port}
  inventory-validation-path: /internal/mock/property-wizard/inventory/validate
  inventory-availability-path: /internal/mock/property-wizard/inventory/availability
  inventory-deduction-path: /internal/mock/property-wizard/inventory/deduct
  inventory-sync-path: /internal/mock/property-wizard/inventory/sync

rate-management-service:
  base-url: http://localhost:${server.port}
  availability-pricing-path: /internal/mock/rate-management/pricing/quotes

arrivals:
  search:
    sync-mode: always

departures:
  search:
    sync-mode: always

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
