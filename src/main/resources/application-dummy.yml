spring:
  datasource:
    url: jdbc:h2:mem:frontdeskdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console

reservation-service:
  base-url: http://localhost:${server.port}
  arrivals-path: /internal/mock/reservations/arrivals
  departures-path: /internal/mock/reservations/departures
  connect-timeout-ms: 1000
  read-timeout-ms: 2000

arrivals:
  search:
    sync-mode: always

departures:
  search:
    sync-mode: always
